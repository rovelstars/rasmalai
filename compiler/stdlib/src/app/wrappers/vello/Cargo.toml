[package]
name = "vello-cabi"
version = "0.1.0"
edition = "2021"

[lib]
name = "vello_cabi"
crate-type = ["staticlib", "cdylib"]

[dependencies]
vello = { version = "0.11", default-features = false, features = ["wgpu"] }
wgpu = { version = "30", default-features = false, features = ["std", "vulkan", "gles", "wgsl"] }
pollster = "0.4"
scene = { path = "../scene" }

[workspace]
