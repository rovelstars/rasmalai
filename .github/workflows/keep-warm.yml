name: Keep warm

# The registry reads from single-region Turso and the edge cache for
# registry responses is short-lived, so an idle site greets visitors
# with multi-second cold starts (sleeping DB, cold isolate, cold edge).
# This hits the cheap endpoints on a schedule to keep all three warm.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Warm site and registry
        run: |
          for url in \
            "https://rasmalai.rovelstars.com/api/packages" \
            "https://rasmalai.rovelstars.com/packages" \
            "https://rasmalai.rovelstars.com/" \
          ; do
            echo "== $url"
            curl -s -D - -o /dev/null --max-time 60 \
              -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" \
              "$url" | grep -iE "^HTTP|^(server|cf-mitigated|cf-ray|content-type):" || true
          done
