name: Release

# Build gates run strictly in order; each leg starts only if the
# previous one succeeded:
#   x86_64-linux -> aarch64-linux -> x86_64-windows -> aarch64-macos
# then publish. A red leg stops everything after it.
#
# Iterating on one leg: dispatch with `from` set to that leg; earlier
# legs are skipped and publish stays skipped (it only runs after a
# full chain). Finalize with a tag push, which always runs everything
# and publishes all four tarballs.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build, e.g. v0.1.0. Empty means the newest v* tag."
        required: false
        default: ""
      from:
        description: "First leg to run; earlier legs are skipped (their artifacts must already be on the release)."
        required: false
        default: "x86_64-linux"
        type: choice
        options:
          - x86_64-linux
          - aarch64-linux
          - x86_64-windows
          - aarch64-macos

env:
  CARGO_TERM_COLOR: always

jobs:
  check-tag:
    name: check tag matches cli version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      value: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag matches cli version
        run: |
          want="${{ steps.tag.outputs.value }}"
          want="${want#v}"
          have="$(sed -n 's/^version = "\(.*\)"/\1/p' compiler/cli/Cargo.toml | head -1)"
          if [ "$want" != "$have" ]; then
            echo "tag $want != cli version $have" >&2
            exit 1
          fi

  build-linux-x64:
    name: x86_64-linux
    if: ${{ inputs.from == '' || inputs.from == 'x86_64-linux' }}
    needs: check-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TARGET: x86_64-linux
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}

      - name: Install LLVM 22
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64-linux

      - name: Build release binary
        run: cargo build --release -p cli

      - name: Smoke test
        run: |
          ./target/release/rnx --version
          echo 'print("release-ok");' > /tmp/smoke.rnx
          ./target/release/rnx run /tmp/smoke.rnx

      - name: Package tarball
        run: |
          stage="rnx-${TARGET}"
          mkdir -p "$stage/bin" "$stage/lib"
          cp target/release/rnx "$stage/bin/rnx.bin"
          for lib in $(ldd target/release/rnx | grep -o '/[^ ]*libLLVM[^ ]*'); do
            cp -L "$lib" "$stage/lib/"
          done
          cat > "$stage/bin/rnx" <<'WRAPPER'
          #!/bin/sh
          here="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$here/../lib:${LD_LIBRARY_PATH:-}"
          exec "$here/rnx.bin" "$@"
          WRAPPER
          chmod +x "$stage/bin/rnx"
          tar czf "$stage.tar.gz" "$stage"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rnx-x86_64-linux
          path: rnx-x86_64-linux.tar.gz

  build-linux-arm64:
    name: aarch64-linux
    if: ${{ always() && needs.build-linux-x64.result != 'failure' && needs.build-linux-x64.result != 'cancelled' && (inputs.from == '' || inputs.from == 'x86_64-linux' || inputs.from == 'aarch64-linux') }}
    needs: build-linux-x64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      TARGET: aarch64-linux
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}

      - name: Install LLVM 22
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-aarch64-linux

      - name: Build release binary
        run: cargo build --release -p cli

      - name: Smoke test
        run: |
          ./target/release/rnx --version
          echo 'print("release-ok");' > /tmp/smoke.rnx
          ./target/release/rnx run /tmp/smoke.rnx

      - name: Package tarball
        run: |
          stage="rnx-${TARGET}"
          mkdir -p "$stage/bin" "$stage/lib"
          cp target/release/rnx "$stage/bin/rnx.bin"
          for lib in $(ldd target/release/rnx | grep -o '/[^ ]*libLLVM[^ ]*'); do
            cp -L "$lib" "$stage/lib/"
          done
          cat > "$stage/bin/rnx" <<'WRAPPER'
          #!/bin/sh
          here="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$here/../lib:${LD_LIBRARY_PATH:-}"
          exec "$here/rnx.bin" "$@"
          WRAPPER
          chmod +x "$stage/bin/rnx"
          tar czf "$stage.tar.gz" "$stage"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rnx-aarch64-linux
          path: rnx-aarch64-linux.tar.gz

  build-windows-x64:
    name: x86_64-windows
    if: ${{ always() && needs.build-linux-arm64.result != 'failure' && needs.build-linux-arm64.result != 'cancelled' && (inputs.from == '' || inputs.from == 'x86_64-linux' || inputs.from == 'aarch64-linux' || inputs.from == 'x86_64-windows') }}
    needs: build-linux-arm64
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      TARGET: x86_64-windows
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}

      - name: Install msys2 with LLVM 22
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: git mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-llvm mingw-w64-ucrt-x86_64-libffi mingw-w64-ucrt-x86_64-zstd mingw-w64-ucrt-x86_64-libxml2

      - name: Bridge cargo into msys2 PATH
        shell: pwsh
        run: |
          $cargo = (Get-Command cargo.exe).Path
          $msysCargo = '/' + $cargo.Substring(0, 1).ToLower() + ($cargo.Substring(2) -replace '\\', '/')
          "CARGO_EXE=$msysCargo" >> $env:GITHUB_ENV

      - name: Check LLVM version
        run: |
          llvm-config --version
          test "$(llvm-config --version | cut -d. -f1,2)" = "22.1"

      - name: Install Rust (GNU target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64-windows

      - name: Build release binary
        env:
          LLVM_SYS_221_PREFIX: /ucrt64
          RUSTFLAGS: -l ffi
        run: '"$CARGO_EXE" build --release --target x86_64-pc-windows-gnu -p cli'

      - name: Smoke test
        run: |
          ./target/x86_64-pc-windows-gnu/release/rnx.exe --version
          echo 'print("release-ok");' > /tmp/smoke.rnx
          ./target/x86_64-pc-windows-gnu/release/rnx.exe run /tmp/smoke.rnx

      - name: Package tarball
        run: |
          stage="rnx-${TARGET}"
          mkdir -p "$stage/bin"
          cp target/x86_64-pc-windows-gnu/release/rnx.exe "$stage/bin/rnx.exe"
          for lib in $(ldd target/x86_64-pc-windows-gnu/release/rnx.exe | grep -o '/ucrt64/bin/[^ ]*'); do
            cp -L "$lib" "$stage/bin/"
          done
          tar czf "$stage.tar.gz" "$stage"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rnx-x86_64-windows
          path: rnx-x86_64-windows.tar.gz

  build-macos-arm64:
    name: aarch64-macos
    if: ${{ always() && needs.build-windows-x64.result != 'failure' && needs.build-windows-x64.result != 'cancelled' }}
    needs: build-windows-x64
    runs-on: macos-14
    timeout-minutes: 360
    env:
      TARGET: aarch64-macos
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}

      - name: Install LLVM 22
        run: |
          brew install llvm@22
          echo "LLVM_SYS_221_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-aarch64-macos

      - name: Build release binary
        run: cargo build --release -p cli

      - name: Smoke test
        run: |
          ./target/release/rnx --version
          echo 'print("release-ok");' > /tmp/smoke.rnx
          ./target/release/rnx run /tmp/smoke.rnx

      - name: Package tarball
        run: |
          stage="rnx-${TARGET}"
          mkdir -p "$stage/bin" "$stage/lib"
          cp target/release/rnx "$stage/bin/rnx.bin"
          for lib in $(otool -L target/release/rnx | grep -o '/[^ ]*libLLVM[^ ]*'); do
            cp -L "$lib" "$stage/lib/"
          done
          cat > "$stage/bin/rnx" <<'WRAPPER'
          #!/bin/sh
          here="$(cd "$(dirname "$0")" && pwd)"
          export DYLD_LIBRARY_PATH="$here/../lib:${DYLD_LIBRARY_PATH:-}"
          exec "$here/rnx.bin" "$@"
          WRAPPER
          chmod +x "$stage/bin/rnx"
          tar czf "$stage.tar.gz" "$stage"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rnx-aarch64-macos
          path: rnx-aarch64-macos.tar.gz

  publish:
    name: publish release
    if: ${{ always() && needs.build-macos-arm64.result == 'success' }}
    needs: build-macos-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Upload tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "rnx $tag" --draft=false
          fi
          gh release upload "$tag" dist/*.tar.gz --clobber

  publish-std:
    name: publish stdlib packages to registry
    if: ${{ always() && needs.publish.result == 'success' }}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-dev
          save-if: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Publish @std packages
        working-directory: website
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: node scripts/publish-std.mjs
