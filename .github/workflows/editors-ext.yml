name: editors-ext

# Publishes generated editor support to renhiyama/rasmalai-ext.
# Requires the RASMALAI_EXT_TOKEN secret: a fine-grained token with
# contents:write on renhiyama/rasmalai-ext.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Source tag, for example v0.3.2
        required: true

permissions:
  contents: read

concurrency:
  group: editors-ext
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Generate and test the grammar
        working-directory: editors/tree-sitter-rasmalai
        run: |
          tree-sitter generate
          tree-sitter test

      - name: Stage the distribution tree
        run: |
          version="${SOURCE_TAG#v}"
          sh editors/package-ext.sh "$RUNNER_TEMP/rasmalai-ext" "$version" "$GITHUB_SHA"

      - name: Push the tagged release
        env:
          EXT_TOKEN: ${{ secrets.RASMALAI_EXT_TOKEN }}
        run: |
          set -eu
          if [ -z "$EXT_TOKEN" ]; then
            echo "::error::RASMALAI_EXT_TOKEN is not set"
            exit 1
          fi
          version="${SOURCE_TAG#v}"
          cd "$RUNNER_TEMP/rasmalai-ext"
          git init -q
          git checkout -q -b main
          git config user.name "rasmalai-bot"
          git config user.email "bot@rasmalai.dev"
          git remote add origin "https://x-access-token:$EXT_TOKEN@github.com/renhiyama/rasmalai-ext.git"
          if git ls-remote --tags origin "refs/tags/v$version" | grep -q .; then
            echo "v$version is already published"
            exit 0
          fi
          git add -A
          git commit -q -m "release: v$version from rovelstars/rasmalai@$GITHUB_SHA"
          git tag "v$version"
          git push --atomic origin main "refs/tags/v$version"
