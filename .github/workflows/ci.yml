name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Test binaries carry full debug info by default, which alone can exceed the
  # runner's disk once the workspace and its caches are restored. Symbols and
  # line tables are not needed for the tests, so keep the profile lean.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

# PR pushes cancel their superseded runs; main runs never cancel, so every
# merged commit gets its verdict (out-of-order finishing cannot confuse
# main-health.sh, which walks newest-created-first).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: ${{ matrix.total == 1 && 'nextest --workspace' || format('nextest --workspace ({0}/{1})', matrix.shard, matrix.total) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # PR runs keep the affected-only filter and one shard; main runs the
        # full suite split across four hash partitions.
        shard: ${{ github.event_name == 'pull_request' && fromJSON('[1]') || fromJSON('[1,2,3,4]') }}
        total: ${{ github.event_name == 'pull_request' && fromJSON('[1]') || fromJSON('[4]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Affected-only PR runs diff against the base ref, which needs the
          # full history present for merge-base.
          fetch-depth: 0

      - name: Reclaim runner disk
        # The hosted image ships Android, .NET, CodeQL, and Haskell toolchains
        # this job never uses. The workspace build plus the restored cargo
        # cache fills the ~14 GB root disk on its own, so remove those first.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install LLVM 22
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev gdb binutils lld-22
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149

      # Every shard builds the same release test binaries, so one shared key
      # is correct here. The first shard to save wins; the rest restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-release

      - name: Cache global build pools
        uses: actions/cache@v6
        with:
          path: ~/.cache/rnx
          # depcache keys products on the stdlib source digest plus
          # CARGO_PKG_VERSION, which tracks the cli crate version here, so nothing
          # in-tree records which compiler revision emitted them. Hashing the
          # compiler sources is what stops a codegen change from restoring
          # products that still pass validate_dep_product. The profile is part
          # of the key because release and debug products are not interchangeable.
          key: rnx-global-v3-${{ runner.os }}-release-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'compiler/*/Cargo.toml', 'compiler/*/build.rs', 'compiler/*/src/**', 'compiler/runtime/bundle/**') }}

      - name: Ensure jq (affected-tests + main-health selectors)
        # Both CI selectors shell out to jq. ubuntu runners ship it today,
        # but the suite must not depend on the runner image: install when
        # absent so a future image change fails loud here, not silently
        # inside a fail-open selector.
        run: command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }

      - name: Prepare linker
        run: |
          command -v ld >/dev/null || { echo "no ld on PATH"; exit 1; }
          command -v ld.lld >/dev/null || ln -sf /usr/lib/llvm-22/bin/ld.lld /usr/local/bin/ld.lld

      - name: Prepare offline probe
        if: matrix.shard == 1
        run: |
          # The standard library comes from the repository checkout
          # directly. There is no vendor staging step, no registry
          # download, and no package list to keep in sync as modules are
          # added. The checkout is the source of truth for local
          # development and for CI.
          export RNX_VENDOR_DIR="$GITHUB_WORKSPACE/compiler/stdlib/src"
          export RNX_CACHE_HOME="${{ runner.temp }}/rnx-empty-cache"
          mkdir -p "$RNX_CACHE_HOME"
          mkdir -p "${{ runner.temp }}/offline-probe/src"
          cat > "${{ runner.temp }}/offline-probe/Project.config" <<'EOF'
          export default {
              project: { name: "probe", version: "0.1.0" }
          }
          EOF
          cat > "${{ runner.temp }}/offline-probe/src/main.rnx" <<'EOF'
          import { Clock } from "@std/time";

          fn Main(): Int {
              let clock = Clock.virtual(0);
              clock.tick(2500000);
              return clock.now().toMillis();
          }
          EOF
          # The checkout alone (empty cache, dead registry for this one
          # command) resolves through the local-source override and
          # warns once per package.
          RNX_REGISTRY="http://127.0.0.1:9" cargo run -q -p cli --release -- build "${{ runner.temp }}/offline-probe/src/main.rnx" 2>"${{ runner.temp }}/probe-stderr.txt"
          grep -q "using local source" "${{ runner.temp }}/probe-stderr.txt" || { echo "probe build printed no local-source warning"; cat "${{ runner.temp }}/probe-stderr.txt"; exit 1; }
          set +e
          "${{ runner.temp }}/offline-probe/.rnx-cache/build/dev/probe"
          code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "probe binary returned $code (want 2)"; exit 1; }

      - name: Workspace test suite (affected on PR, full on main)
        run: |
          sudo sysctl -w kernel.core_pattern='/tmp/rnx-core-%e-%p' >/dev/null
          ulimit -c unlimited
          export RNX_VENDOR_DIR="$GITHUB_WORKSPACE/compiler/stdlib/src"
          # RNX_VENDOR_DIR stays exported for the suite below: the
          # standard library under test is the repository checkout,
          # never the registry cache, so `@std/*` resolution exercises
          # the edited sources (including declared `from runtime`
          # imports) with no registry access. Tests that need a registry
          # run their own local fixture and set their own environment.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILTER="$(bash .github/scripts/affected-tests.sh "origin/${{ github.base_ref }}")"
            HEALTH="$(bash .github/scripts/main-health.sh || printf 'MAIN_GREEN\nINFLIGHT_NONE\n')"
            MAIN_STATE="$(echo "$HEALTH" | head -1)"
            MAIN_FLIGHT="$(echo "$HEALTH" | sed -n '2p')"
            [ -n "$MAIN_STATE" ] || MAIN_STATE="MAIN_GREEN"
            [ "$MAIN_FLIGHT" = "INFLIGHT_NONE" ] || [ -z "$MAIN_FLIGHT" ] || echo "::notice ::main CI in flight for ${MAIN_FLIGHT#INFLIGHT_}; health below reflects the last completed run."
            if [ "$MAIN_STATE" != "MAIN_GREEN" ]; then
              echo "::warning ::main is red ${MAIN_STATE} - running the full suite; a red here does not necessarily implicate this PR."
              FILTER="FULL"
            fi
          else
            FILTER="FULL"
          fi
          [ -n "$FILTER" ] || FILTER="FULL"
          PARTITION="hash:${{ matrix.shard }}/${{ matrix.total }}"
          echo "nextest target list: $FILTER"
          echo "nextest partition: $PARTITION"
          run_suite() {
            if [ "$FILTER" = "FULL" ]; then
              cargo nextest run --workspace --profile ci --cargo-profile release --no-fail-fast --partition "$PARTITION"
            else
              # FILTER is a `-p <pkg>` list produced by affected-tests.sh.
              # shellcheck disable=SC2086
              cargo nextest run --profile ci --cargo-profile release --no-fail-fast --partition "$PARTITION" $FILTER
            fi
          }
          run_suite || {
            echo "--- test failure: collecting native backtraces from cores ---"
            for core in /tmp/rnx-core-*; do
              [ -f "$core" ] || continue
              out=$(gdb -batch -c "$core" -ex 'thread apply all bt 15' 2>&1 | head -100)
              sig=$(echo "$out" | grep -oE "Program terminated with signal [A-Z]+" | head -1)
              exe=$(echo "$out" | grep -oE "Core was generated by .*" | head -1 | sed -e "s/.*by .//" -e "s/['\"\` ].*//")
              echo "=== $sig :: $exe ($(stat -c %s "$core") bytes, $core) ==="
              case "$sig" in
                *SIGSEGV*|*SIGBUS*)
                  if [ -n "$exe" ] && [ -f "$exe" ]; then
                    gdb -batch "$exe" "$core" -ex 'thread apply all bt 15' 2>/dev/null | head -100
                  else
                    echo "$out" | head -40
                  fi
                  ;;
                *)
                  echo "$out" | head -6
                  ;;
              esac
              rm -f "$core"
            done
            exit 1
          }

  wrappers:
    name: native wrappers
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install Vulkan, GL, and fonts
        # vello and wgpu need an adapter; the runner has no GPU, so lavapipe
        # provides Vulkan in software. Parley needs at least one font.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri libwayland-dev libxkbcommon-dev libfontconfig1-dev libfreetype-dev fonts-dejavu-core \
            libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libv4l-dev ffmpeg

      - name: Install LLVM 22
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: wrappers
          cache-all-crates: true

      - name: Cache wrapper build tree
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.rnx-cache/wrapper-target
          key: wrapper-target-${{ runner.os }}-${{ hashFiles('compiler/stdlib/src/app/wrappers/*/Cargo.lock') }}

      - name: Build the compiler
        run: cargo build --release -p cli

      - name: Build wrappers and run the probes
        run: sh compiler/stdlib/src/app/tools/ci-wrappers.sh

      - name: MCP UI script test
        run: cargo test --release -p cli --test mcp_ui

  website:
    name: website checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # After wasm-pack on purpose: rust-cache strips whatever already sits in
      # ~/.cargo/bin, and that installer is unpinned, so caching it would hold
      # CI on whatever wasm-pack shipped the day the cache was written.
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
          cache-all-crates: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
      # Publish tests exercise the server canonicalize/analyze path, which
      # reads the vendored wasm from disk: it must be built before npm test.
      - run: npm run build:wasm:ci
      - run: npm run check:content
      - run: npm test
      - run: npm run build
