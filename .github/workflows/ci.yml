name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: cargo test --workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 22
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Full workspace test suite
        run: |
          sudo apt-get install -y gdb
          sudo sysctl -w kernel.core_pattern='/tmp/rnx-core-%e-%p' >/dev/null
          ulimit -c unlimited
          cargo run -q -p cli -- doc --json --stdlib --out-dir website/static/data
          cargo test --workspace --no-fail-fast || {
            echo "--- test failure: collecting native backtraces from cores ---"
            for core in /tmp/rnx-core-*; do
              [ -f "$core" ] || continue
              out=$(gdb -batch "$core" -ex 'thread apply all bt 15' 2>&1 | head -100)
              sig=$(echo "$out" | grep -oE "Program terminated with signal [A-Z]+" | head -1)
              exe=$(echo "$out" | grep -oE "Core was generated by .*" | head -1 | sed -e "s/.*by .//" -e "s/['\"\` ].*//")
              echo "=== $sig :: $exe ($core) ==="
              case "$sig" in
                *SIGSEGV*|*SIGBUS*)
                  if [ -n "$exe" ] && [ -f "$exe" ]; then
                    gdb -batch "$exe" "$core" -ex 'thread apply all bt 15' 2>/dev/null | head -100
                  else
                    echo "$out" | head -40
                  fi
                  ;;
                *)
                  echo "$out" | head -6
                  ;;
              esac
            done
            exit 1
          }

  website:
    name: website checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 22 (wasm-pack links host tools)
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Install Rust (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
      - run: npm run check:content
      - run: npm test
      - run: npm run build:wasm
      - run: npm run build
