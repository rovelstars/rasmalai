name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: cargo test --workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 22
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev gdb binutils lld-22
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # `key` and `shared-key` are alternatives in rust-cache: setting
      # `shared-key` drops the job id from the cache key, so a second cached
      # job added to this file would write the same entry and thrash it.
      - uses: Swatinem/rust-cache@v2
        with:
          key: host

      - name: Cache seeded stdlib
        uses: actions/cache@v6
        with:
          path: ~/.cache/rnx
          # depcache keys products on the stdlib source digest plus
          # CARGO_PKG_VERSION, which is a constant 0.1.0 here, so nothing
          # in-tree records which compiler revision emitted them. Hashing the
          # compiler sources is what stops a codegen change from restoring
          # products that still pass validate_dep_product.
          key: rnx-global-v1-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'compiler/*/Cargo.toml', 'compiler/*/build.rs', 'compiler/*/src/**', 'compiler/runtime/bundle/**') }}

      - name: Full workspace test suite
        run: |
          command -v ld >/dev/null || { echo "no ld on PATH"; exit 1; }
          command -v ld.lld >/dev/null || ln -sf /usr/lib/llvm-22/bin/ld.lld /usr/local/bin/ld.lld
          sudo sysctl -w kernel.core_pattern='/tmp/rnx-core-%e-%p' >/dev/null
          ulimit -c unlimited
          seeded=""
          for i in 1 2 3; do
            if cargo run -q -p cli -- fetch-std; then seeded=1; break; fi
            sleep 20
          done
          [ -n "$seeded" ] || { echo "stdlib seeding failed 3x, failing loud"; exit 1; }
          cargo run -q -p cli -- doc --json --stdlib --out-dir website/static/data
          cargo test --workspace --no-fail-fast || {
            echo "--- test failure: collecting native backtraces from cores ---"
            for core in /tmp/rnx-core-*; do
              [ -f "$core" ] || continue
              out=$(gdb -batch -c "$core" -ex 'thread apply all bt 15' 2>&1 | head -100)
              sig=$(echo "$out" | grep -oE "Program terminated with signal [A-Z]+" | head -1)
              exe=$(echo "$out" | grep -oE "Core was generated by .*" | head -1 | sed -e "s/.*by .//" -e "s/['\"\` ].*//")
              echo "=== $sig :: $exe ($(stat -c %s "$core") bytes, $core) ==="
              case "$sig" in
                *SIGSEGV*|*SIGBUS*)
                  if [ -n "$exe" ] && [ -f "$exe" ]; then
                    gdb -batch "$exe" "$core" -ex 'thread apply all bt 15' 2>/dev/null | head -100
                  else
                    echo "$out" | head -40
                  fi
                  ;;
                *)
                  echo "$out" | head -6
                  ;;
              esac
              rm -f "$core"
            done
            exit 1
          }

  website:
    name: website checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # After wasm-pack on purpose: rust-cache strips whatever already sits in
      # ~/.cargo/bin, and that installer is unpinned, so caching it would hold
      # CI on whatever wasm-pack shipped the day the cache was written.
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
          cache-all-crates: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
      # Publish tests exercise the server canonicalize/analyze path, which
      # reads the vendored wasm from disk: it must be built before npm test.
      - run: npm run build:wasm
      - run: npm run check:content
      - run: npm test
      - run: npm run build
