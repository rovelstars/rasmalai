name: Monthly benchmarks

# Re-measures the benchmark suite on the first of every month, ingests the
# result into Turso via POST /api/benchmarks, and force-pushes a copy to
# the orphan benchmarks branch. The homepage Pareto chart reads the API at
# runtime with a fallback to that branch, so the published chart reflects
# the current tree without any snapshot committed to main. The branch push
# is transitional dual-write: delete the Deploy step once the API history
# covers two monthly runs. Standard runners are noisy neighbors: treat
# month-to-month deltas as trends, not records.
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: benchmarks
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 22
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-release
          save-if: false

      - name: Build rnx (release)
        run: |
          ulimit -c 0
          cargo build --release --bin rnx

      - name: Seed stdlib cache
        run: |
          seeded=""
          for i in 1 2 3; do
            if ./target/release/rnx fetch-std; then seeded=1; break; fi
            sleep 20
          done
          [ -n "$seeded" ] || { echo "stdlib seeding failed 3x, failing loud"; exit 1; }

      - name: Run benchmark harness
        run: |
          python3 benches/harness/runner.py --out benches/data/benchmarks.json

      - name: Ingest benchmarks into Turso
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ] || [ -z "$SITE_URL" ]; then
            echo "benchmarks: PUBLISH_TOKEN or SITE_URL unset, cannot ingest" >&2
            exit 1
          fi
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error
          with open('benches/data/benchmarks.json') as f:
              snapshot = json.load(f)
          body = json.dumps({
              'githubRunId': int(os.environ['GITHUB_RUN_ID']),
              'commitSha': os.environ['GITHUB_SHA'],
              'snapshot': snapshot,
          }).encode()
          req = urllib.request.Request(
              os.environ['SITE_URL'].rstrip('/') + '/api/benchmarks',
              data=body,
              headers={
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + os.environ['PUBLISH_TOKEN'],
                  'User-Agent': 'rnx-benchmarks (+https://github.com/rovelstars/rasmalai)',
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as res:
                  print('benchmarks: API ingest', res.status, res.read().decode()[:200])
          except urllib.error.HTTPError as e:
              print('benchmarks: ingest failed', e.code, e.read().decode()[:500])
              raise SystemExit(1)
          EOF

