name: Monthly benchmarks

# Re-measures the benchmark suite on the first of every month and ingests the
# result into Turso via POST /api/benchmarks. The homepage Pareto chart reads
# /api/benchmarks at runtime, so the published numbers track the current tree
# with no snapshot committed to git. Standard runners are noisy neighbors:
# treat month-to-month deltas as trends, not records.
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 22
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-release
          save-if: false

      # ubuntu-24.04 ships clang, go, node and a JDK but no dart, so the
      # harness detects it as absent and drops the whole dart column. The
      # SDK zip is pinned by version *and* digest: a re-uploaded archive at
      # the same version URL would silently move every dart number, the
      # same drift that keeps the wasm-pack installer out of ci.yml's cache.
      - name: Install Dart 3.13
        run: |
          sdk="https://storage.googleapis.com/dart-archive/channels/stable/release/3.13.5/sdk/dartsdk-linux-x64-release.zip"
          curl -fsSL -o "$RUNNER_TEMP/dartsdk.zip" "$sdk"
          echo "ea864bc64df30a6b8bdf30b2e32550f7717d9a890de8f40293aeabb924fe232b  $RUNNER_TEMP/dartsdk.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/dartsdk.zip" -d "$RUNNER_TEMP/dart"
          echo "$RUNNER_TEMP/dart/dart-sdk/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/dart/dart-sdk/bin/dart" --version

      - name: Build rnx (release)
        run: |
          ulimit -c 0
          cargo build --release --bin rnx

      - name: Use the checkout stdlib
        run: |
          test -f compiler/stdlib/src/prelude/lib.rnx
          echo "RNX_VENDOR_DIR=$GITHUB_WORKSPACE/compiler/stdlib/src" >> "$GITHUB_ENV"

      - name: Run benchmark harness
        run: |
          python3 benches/harness/runner.py --out benches/data/benchmarks.json

      - name: Ingest benchmarks into Turso
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ] || [ -z "$SITE_URL" ]; then
            echo "benchmarks: PUBLISH_TOKEN or SITE_URL unset, cannot ingest" >&2
            exit 1
          fi
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error
          with open('benches/data/benchmarks.json') as f:
              snapshot = json.load(f)
          body = json.dumps({
              'githubRunId': int(os.environ['GITHUB_RUN_ID']),
              'commitSha': os.environ['GITHUB_SHA'],
              'snapshot': snapshot,
          }).encode()
          req = urllib.request.Request(
              os.environ['SITE_URL'].rstrip('/') + '/api/benchmarks',
              data=body,
              headers={
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + os.environ['PUBLISH_TOKEN'],
                  'User-Agent': 'rnx-benchmarks (+https://github.com/rovelstars/rasmalai)',
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as res:
                  print('benchmarks: API ingest', res.status, res.read().decode()[:200])
          except urllib.error.HTTPError as e:
              print('benchmarks: ingest failed', e.code, e.read().decode()[:500])
              raise SystemExit(1)
          EOF

