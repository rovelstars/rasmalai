name: Stress threaded suites

# Temporary crash-hunting harness: the async/threaded e2e suites
# segfault intermittently on CI runners only (never locally). This loops
# the suspect binaries with core dumps enabled so one run captures a
# symbolicated backtrace instead of waiting days for a random strike.
# Delete once the underlying race is fixed and CI is quiet.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Iterations per binary"
        required: false
        default: "15"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 22
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stress
          save-if: false

      - name: Loop suspect suites with cores enabled
        run: |
          sudo apt-get install -y gdb
          sudo sysctl -w kernel.core_pattern='/tmp/rnx-core-%e-%p' >/dev/null
          ulimit -c unlimited
          cargo test -p cli --no-run 2>&1 | tail -1
          rounds="${{ inputs.rounds }}"
          failed=0
          for i in $(seq 1 "${rounds:-5}"); do
            echo "=== full cli package round $i ==="
            if ! cargo test -q -p cli --no-fail-fast 2>&1 | tail -3; then
              echo "CRASH: cli package round $i"
              failed=1
            fi
          done
          for core in /tmp/rnx-core-*; do
            [ -f "$core" ] || continue
            out=$(gdb -batch "$core" -ex 'thread apply all bt 15' 2>/dev/null | head -100)
            exe=$(echo "$out" | grep -oE 'Core was generated by `[^'\'']+' | head -1)
            echo "=== backtrace: $exe ($core) ==="
            echo "$out" | head -100
          done
          exit $failed
