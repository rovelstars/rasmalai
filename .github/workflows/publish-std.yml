name: Publish stdlib

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish from"
        required: false
        default: "main"

env:
  CARGO_TERM_COLOR: always
  RNX_VENDOR_DIR: ${{ github.workspace }}/compiler/stdlib/src

jobs:
  publish:
    name: publish @std packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Install LLVM 22
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64-linux
          save-if: false

      - name: Build rnx
        run: cargo build --release -p cli

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Publish @std packages
        working-directory: website
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: node scripts/publish-std.mjs
